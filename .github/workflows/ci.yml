name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=critical
        # only fails on critical-severity advisories for now — pinning Nest 11 currently
        # carries known high-severity transitive multer advisories with no non-breaking fix;
        # raise this to --audit-level=high once the project moves to Nest 12
      - run: npm run lint:check
      - run: npm run build
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tour_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: tour_booking_test
      JWT_SECRET: test-secret-please-ignore
      JWT_ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_DAYS: 7
      ACTIVATION_TOKEN_TTL_HOURS: 24
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: cp .env.test.example .env.test
      - run: npm run migration:run:test
        # runs migrations directly against the tour_booking_test DB created by the postgres service
      - run: NODE_ENV=test npx jest --config ./test/jest-e2e.json --runInBand
        # calls jest directly (not `npm run test:e2e`) to skip the pretest:e2e hook, which
        # assumes a local `tour_booking_db` docker container for creating the test DB
