services:
  postgres:
    image: postgres:16-alpine
    container_name: tour_booking_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tour_booking
    ports:
      - '5432:5432'
    volumes:
      - tour_booking_pgdata:/var/lib/postgresql/data

volumes:
  tour_booking_pgdata:
