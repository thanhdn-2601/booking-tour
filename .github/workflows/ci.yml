name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=critical
        # only fails on critical-severity advisories for now — nestjs-i18n@<6 pulls in a
        # high-severity transitive braces/chokidar advisory with no non-breaking fix;
        # raise this to --audit-level=high once the project moves to nestjs-i18n@5+
      - run: npm run lint:check
      - run: npm run build
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tour_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailhog:
        image: mailhog/mailhog
        ports:
          - 1025:1025
          - 8025:8025
    env:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: tour_booking_test
      JWT_SECRET: test-secret-please-ignore
      JWT_ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_DAYS: 7
      ACTIVATION_TOKEN_TTL_HOURS: 24
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      MAIL_HOST: localhost
      MAIL_PORT: 1025
      MAIL_FROM: "Tour Booking <no-reply@tour-booking.local>"
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:3000/api/v1/auth/google/callback
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: cp .env.test.example .env.test
      - run: npm run migration:run:test
        # runs migrations directly against the tour_booking_test DB created by the postgres service
      - run: NODE_ENV=test npx jest --config ./test/jest-e2e.json --runInBand
        # calls jest directly (not `npm run test:e2e`) to skip the pretest:e2e hook, which
        # assumes a local `tour_booking_db` docker container for creating the test DB
